[package]
name = "sherka-compagnon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compagnon de bureau à profils indépendants"

[lib]
name = "sherka_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
sherka-core = { path = "../crates/sherka-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
tauri-plugin-updater = "2"
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

